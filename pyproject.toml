[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hebrah"
version = "0.8.1"
description = "Official Python SDK for the Hebrah healthcare connectivity platform — FHIR, HL7 v2, sandbox provisioning, and webhook delivery"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = [
  "hebrah",
  "healthcare",
  "fhir",
  "fhir-client",
  "hl7",
  "hl7v2",
  "ehr",
  "emr",
  "sandbox",
  "webhooks",
  "api-client",
  "medical-api",
  "healthcare-api",
  "sdk",
  "python-sdk",
  "hipaa",
]
authors = [{ name = "hebrah" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "respx>=0.23.1",
  "ruff>=0.9.0",
]

[project.urls]
Homepage = "https://hebrah.com"
Documentation = "https://app.hebrah.com/docs/sdk"
Repository = "https://github.com/Hebrah-inc/hebrah-sdk-python"

[tool.hatch.build.targets.wheel]
packages = ["src/hebrah"]

[tool.hatch.build.targets.wheel.force-include]
"SECURITY.md" = "SECURITY.md"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]